<!DOCTYPE html>
<html lang="es"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generador Pocitos AX - Eliud Monsivais</title>
<style>
body{font-family:Arial;margin:0;padding:15px;background:#f5f5f5}
.card{background:white;border-radius:15px;padding:15px;box-shadow:0 2px 10px #0002}
input,select{width:100%;padding:15px;font-size:18px;border-radius:10px;border:1px solid #ccc;margin:10px 0}
.btn{background:#1fad53;color:white;border:none;padding:18px;width:100%;font-size:22px;font-weight:bold;border-radius:12px;margin-top:15px}
#barraWrap{display:none;background:#e0e0e0;border-radius:10px;height:28px;overflow:hidden;margin-top:15px}
#barra{background:#1fad53;width:0%;height:100%;transition:0.2s}
</style></head><body>
<div class="card">
<h2 style="text-align:center">🎲 Generador de Pocitos AX</h2>
<img src="https://i.ibb.co/6XyJ4q0/pocitos-preview.jpg" style="width:100%;border-radius:10px">
<p style="text-align:center"><b>Eliud Monsivais</b> • WhatsApp 8115566250</p>
<label>Número de tabloides (1-500)</label>
<input type="number" id="num" value="5" min="1" max="500">
<label>Orientación</label>
<select id="ori"><option value="H">Horizontal</option><option value="V">Vertical</option></select>
<div id="barraWrap"><div id="barra"></div></div>
<p id="txt" style="text-align:center;font-weight:bold;color:#1fad53"></p>
<button class="btn" onclick="generarPDF()">⬇️ GENERAR PDF</button>
</div>
<script>
function generarPDF(){
 let n=document.getElementById('num').value; let o=document.getElementById('ori').value;
 document.getElementById('barraWrap').style.display='block';
 let p=0; let t=document.getElementById('txt'); let b=document.getElementById('barra');
 let inter=setInterval(()=>{p+=2; if(p>95)p=95; b.style.width=p+'%'; t.innerText=p+'% Generando '+n+' tabloides...';},80);
 fetch('/generar',{method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body:`num_tabloides=${n}&orientacion=${o}`})
 .then(r=>{if(!r.ok)throw r; return r.blob()}).then(blob=>{
   clearInterval(inter); b.style.width='100%'; t.innerText='100% ¡Listo!';
   let url=URL.createObjectURL(blob); let a=document.createElement('a'); a.href=url; a.download='POCITOS_'+n+'_TABLOIDES.pdf'; a.click();
 }).catch(()=>{clearInterval(inter); t.innerText='Error';});
}
</script>
</body></html>
